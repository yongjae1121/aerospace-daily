name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:      # Actions 탭에서 수동 실행, 또는 merge-lessons.yml이 호출

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate lessons & build data/course.js
        run: python3 scripts/build.py
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html assets _site/
          cp data/course.js _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
